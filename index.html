<section id="security-configurator" style="padding: 80px 10%; background: #fff;">
    <h2 style="text-align: center; letter-spacing: 2px; margin-bottom: 50px;">SECURITY PLANS</h2>
    
    <div style="display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;">
        
        <div class="card" style="border: 1px solid #e0e0e0; padding: 40px; width: 350px; transition: 0.3s;">
            <h3 style="color: #c5a059;">Private Residence</h3>
            <p>Protezione avanzata per la tua dimora al confine.</p>
            <form action="javascript:void(0);">
                <input type="text" placeholder="Indirizzo della Proprietà" required style="width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ddd;">
                <input type="email" placeholder="Tua Email" required style="width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ddd;">
                
                <label style="display:block; margin-top:15px;">Livello di Sicurezza:</label>
                <select style="width: 100%; padding: 10px; border: 1px solid #ddd; margin-bottom: 10px;">
                    <option>Standard (Allarme + Sensori)</option>
                    <option>Elite (Videosorveglianza 24/7)</option>
                    <option>Fortress (AI & Intervento Rapido)</option>
                </select>

                <label style="display:block; margin-top:15px;">Scegli il giorno del sopralluogo:</label>
                <input type="date" style="width: 100%; padding: 10px; border: 1px solid #ddd; margin-bottom: 20px;">
                
                <button style="background: #333; color: white; border: none; padding: 15px 30px; cursor: pointer; width: 100%; letter-spacing: 1px;">PRENOTA CONSULENZA</button>
            </form>
        </div>

        <div class="card" style="border: 1px solid #333; padding: 40px; width: 350px; background: #333; color: #fff;">
            <h3 style="color: #c5a059;">Corporate & Business</h3>
            <p>Sistemi complessi per infrastrutture aziendali.</p>
            <form action="javascript:void(0);">
                <input type="text" placeholder="Sede Legale / Operativa" required style="width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #555; background: #444; color: #fff;">
                <input type="email" placeholder="Email Aziendale" required style="width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #555; background: #444; color: #fff;">
                
                <label style="display:block; margin-top:15px;">Livello di Sicurezza:</label>
                <select style="width: 100%; padding: 10px; border: 1px solid #555; background: #444; color: #fff; margin-bottom: 10px;">
                    <option>Business Basic</option>
                    <option>Industrial Safety</option>
                    <option>High-Security Border Protection</option>
                </select>

                <label style="display:block; margin-top:15px;">Data preferita:</label>
                <input type="date" style="width: 100%; padding: 10px; border: 1px solid #555; background: #444; color: #fff; margin-bottom: 20px;">
                
                <button style="background: #c5a059; color: white; border: none; padding: 15px 30px; cursor: pointer; width: 100%; letter-spacing: 1px;">RICHIEDI AUDIT AZIENDALE</button>
            </form>
        </div>

    </div>
</section>
